  const composeSelectFormatter = (invalidArray, dictionary, Fieldlength) => {
    return (cell) => {
      let value = cell.getValue();
      const parentRow = cell.getRow();
      const postingKey = parentRow.getData().c_Y_BSCHL;

      if (value && (cell.getField() === "c_Y_WRBTR2" || cell.getField() === "c_Y_WRBTR1")) {
        value = Number(value).toLocaleString();
      }

      if (invalidArray.includes(postingKey)) {
        if (!value || !dictionary) {
          cell.getElement().classList.add("invalid");
        }else if(Fieldlength < value.length){
          cell.getElement().classList.add("invalid");
        } else {
          cell.getElement().classList.remove("invalid");
        }
      }
      return value;
    };
  };

  var commasFormatter = () => {
    return (cell) => {
      let value = cell.getValue();
      if (value) {
        const [integerPart, decimalPart] = String(value).split('.');
        const integerWithCommas = integerPart.replace(/\B(?=(\d{3})+(?!\d))/g, ',');

        if (decimalPart) {
          return `${integerWithCommas}.${decimalPart}`;
        }

        return integerWithCommas;

      }
    }
  }

  function numberValidator(cell, value) {
    if (!hasHalfWidthNumbers(value) && value != '') return false;
    const [wholeNumber, decimalPart = ""] = String(value).split(".");
    return wholeNumber.length <= 13 && decimalPart.length <= 2;
  }

  function numberValidatorAmounts(cell, value) {
    //console.log("numberValidatorAmounts is working")
    //console.log({ value: value})
    if (!hasHalfWidthNumbers(value) && value != '') return false;

    const [wholeNumber, decimalPart = ""] = String(value).split(".");

    //console.log({ wholeNumber: wholeNumber, decimalPart: decimalPart });

    if (decimalPart == "" && wholeNumber.length > 13) return false;
    if (decimalPart != "" && wholeNumber.length > 11) return false;

    //console.log({ decimalPart: decimalPart.length <= 2 })
    return decimalPart.length <= 2;
  }

  function numberValidator_extra(cell, value) {
    if (!hasHalfWidthNumbers(value) && value != '') return false;

    const [wholeNumber, decimalPart = ""] = String(value).split(".");

    return wholeNumber.length <= 19 && decimalPart.length <= 4;
  }


  function hasHalfWidthNumbers(text) {
    for (let i = 0; i < text.length; i++) {
      const charCode = text.charCodeAt(i);
      if ((charCode < 48 || charCode > 57) && (charCode != 46)) {
        return false;
      }
    }
    return true;
  }

   var customDateEditor = function (cell, onRendered, success, cancel, editorParams) {
      var cellValue = cell.getValue();
      var input = document.createElement("input");
      input.type = "date";
      if (cell.getValue()) {
        input.value = luxon.DateTime.fromFormat(cell.getValue(), "yyyy/MM/dd").toFormat("yyyy-MM-dd")
      }
      input.style.maxWidth = "95%";

      // Comment starts here
      flatpickr(input, {
        onClose: function (selectedDates, dateStr, instance) {
          success(dateStr)
        },
        dateFormat: "Y/m/d",
        minDate: "2023/01/01",
        maxDate: "2099/12/31",
        "disable": [
          function (date) {
            const postingKey = cell.getRow().getData().c_Y_BSCHL;
            if (['21', '31'].includes(postingKey)) {
              return (date.getDay() === 0 || date.getDay() === 6);  // disable weekends for '21' and '31'
            } else if (['01', '11', '40', '50'].includes(postingKey)) {
              return false;  // allow weekends for '01', '11', '40', and '50'
            }
            return (date.getDay() === 0 || date.getDay() === 6);  // disable weekends for other posting keys
          }
        ],
        locale: {
            "firstDayOfWeek": 1,
            "rangeSeparator": " から ",
            "weekdays": {
              "shorthand": ["日", "月", "火", "水", "木", "金", "土"],
              "longhand": [
                "日曜日",
                "月曜日",
                "火曜日",
                "水曜日",
                "木曜日",
                "金曜日",
                "土曜日"
              ]
            },
            "months": {
              "shorthand": [
                "1月",
                "2月",
                "3月",
                "4月",
                "5月",
                "6月",
                "7月",
                "8月",
                "9月",
                "10月",
                "11月",
                "12月"
              ],
            "longhand": [
                    "1月",
                    "2月",
                    "3月",
                    "4月",
                    "5月",
                    "6月",
                    "7月",
                    "8月",
                    "9月",
                    "10月",
                    "11月",
                    "12月"
                  ]
            }
      }
      });
      // Comment ends here

      cell.onFocus = function () {
        input.click()
      }
      onRendered(function () {
        input.focus();
        input.click()
      })

      return input;
    };

   if (rowIndex > 1) {
      var previousRow = cell.getTable().getRowFromPosition(rowIndex - 1);
      var previousDateStr = previousRow.getCell("transfer_plan_posting_date").getValue();
    if (previousDateStr) {
        var previousDateObj = new Date(previousDateStr.split('/').join('-'));

      }
    }

    // Get the next row's date

    if (rowIndex < totalRows) {
      var nextRow = cell.getTable().getRowFromPosition(rowIndex + 1);
      var nextDateStr = nextRow.getCell("transfer_plan_posting_date").getValue();
      if (nextDateStr) {
        nextDate = new Date(nextDateStr.split('/').join('-'));
      }
    } 

// Add an event listener to capture the value when it change

      dateFormat: "Y/m/d",

      maxDate: maxDate,
   
    // Added By Prachi 2024/06/19
       disable: [
        function (date) {
          if (previousDate && nextDate) {
            return date <= previousDate || date >= nextDate;
          } else if (previousDate) {
            return date <= previousDate;
          } else if (nextDate) {
            return date >= nextDate;
          }
