<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dictionary Search</title>
    <style>
      /* Basic Reset */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background-color: #f0f0f0;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
}

.container {
    background-color: #ffffff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 0 15px rgba(0, 0, 0, 0.2);
    width: 300px;
    text-align: center;
}

h1 {
    margin-bottom: 20px;
    color: #333;
}

input {
    width: calc(100% - 22px);
    padding: 10px;
    margin-bottom: 10px;
    border: 1px solid #ddd;
    border-radius: 4px;
    font-size: 16px;
}

button {
    padding: 10px 20px;
    border: none;
    border-radius: 4px;
    background-color: #007bff;
    color: #ffffff;
    font-size: 16px;
    cursor: pointer;
    transition: background-color 0.3s;
}

button:hover {
    background-color: #0056b3;
}

#result {
    margin-top: 20px;
    text-align: left;
}

h2 {
    margin-bottom: 10px;
    color: #333;
    font-size: 18px;
}

p, ul {
    color: #666;
    font-size: 16px;
}

ul {
    list-style-type: none;
    padding: 0;
}

li {
    margin: 5px 0;
    background-color: #f9f9f9;
    padding: 5px;
    border-radius: 4px;
    border: 1px solid #ddd;
}

    </style>
</head>
<body>
    <div class="container">
        <h1>Dictionary Search</h1>
        <input type="text" id="searchInput" placeholder="Enter a word">
        <button id="searchButton">Search</button>
        <div id="result">
            <h2>Meaning:</h2>
            <p id="definition"></p>
            <h2>Related Words:</h2>
            <ul id="relatedWords"></ul>
        </div>
    </div>
    <script>
      document.getElementById('searchButton').addEventListener('click', () => {
    const word = document.getElementById('searchInput').value.trim();
    if (word) {
        fetchWordData(word);
    }
});

function fetchWordData(word) {
    // Free Dictionary API endpoint
    const apiUrl = `https://api.dictionaryapi.dev/api/v2/entries/en/${word}`;

    fetch(apiUrl)
        .then(response => {
            if (!response.ok) {
                throw new Error('Word not found');
            }
            return response.json();
        })
        .then(data => displayResults(data))
        .catch(error => {
            console.error('Error fetching word data:', error);
            document.getElementById('definition').innerText = 'No definition found.';
            document.getElementById('relatedWords').innerHTML = '';
        });
}

function displayResults(data) {
    const meanings = data[0].meanings;
    let definitions = [];
    let relatedWords = [];

    meanings.forEach(meaning => {
        meaning.definitions.forEach(def => {
            definitions.push(def.definition);
        });
    });

    // For related words, we might use synonyms (if available in the API)
    // Note: Free Dictionary API does not provide synonyms directly
    // For demonstration, we leave related words empty

    document.getElementById('definition').innerText = definitions.join(', ') || 'No definition found.';
    const relatedWordsList = document.getElementById('relatedWords');
    relatedWordsList.innerHTML = relatedWords.length ? relatedWords.map(word => `<li>${word}</li>`).join('') : '<li>No related words found.</li>';
}

    </script>
</body>
</html>
